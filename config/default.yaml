app:
  locale: ru
  data_dir: null          # null → каталог _data рядом с корнем репозитория

window:
  width: 96
  height: 96
  always_on_top: false
  click_through: false
  never_minimize: true   # окно немедленно возвращается из свёрнутого состояния
  tool_window: true      # окно-инструмент (Qt.Tool / WS_EX_TOOLWINDOW): не в панели задач и Alt+Tab
  desktop_reassert: true       # сторож: после «Показать рабочий стол» вернуть муху наверх
  desktop_reassert_ms: 800     # период проверки сторожа, миллисекунды
  feeding_point: { x: null, y: null }  # null → правый нижний угол рабочей области
  title: "fly-pet"

tick:
  needs_interval_sec: 30
  brain_interval_sec: 120
  animation_fps: 8

bubble:
  ttl_sec: 5          # сколько секунд висит реплика
  max_width: 260      # максимальная ширина облачка, px
  offset_px: 14       # отступ от питомца и внутренний padding текста
  font_pt: 10         # размер шрифта реплики

needs:
  start:
    hunger: 40
    energy: 70
    mood: 60
    attention: 50
  decay_per_minute:
    hunger: 0.8
    energy: 0.5
    mood: 0.3
    attention: 1.0
  event_cooldown_sec: 300   # минимум секунд между одинаковыми событиями потребностей
  restore_per_minute:
    energy: 3.0             # рост энергии во сне
  thresholds:
    sleep_energy_below: 20
    complain_hunger_above: 70
    bored_attention_above: 80  # attention выше → событие bored
    wake_energy_above: 35      # energy выше → выход из сна в idle

llm:
  base_url: https://api.deepseek.com
  model: deepseek-chat
  timeout_sec: 30
  max_tokens: 256
  temperature: 0.4

safety:
  dry_run: true
  allow_real_actions: false

desktop:
  use_registry_path: true
  allowed_extensions: []
  blocked_extensions: [".lnk", ".url", ".ini"]
  blocked_names: ["desktop.ini"]
  exclude_globs: []
  min_age_days: 7
  skip_hidden: true
  skip_system: true
  files_only: true
  never_dirs: ["C:/Users/Public/Desktop"]

actions:
  - name: eat_desktop_file
    enabled: true
    params: {}
  - name: report
    enabled: true
    params: {}
  - name: idle_nudge
    enabled: true
    params: { idle_after_sec: 900 }
  - name: sleep
    enabled: true
    params: {}

walk:
  enabled: true
  tick_ms: 40                     # период шага локомоции
  desktop_speed_px_s: 26          # скорость ходьбы по столу
  window_speed_px_s: 22           # скорость ходьбы по полосе окна
  fly_speed_px_s: 520             # скорость полёта
  desktop_margin_px: 12           # отступ от низа рабочей области
  desktop_stay_sec: [8, 25]       # сколько ходит по столу до взлёта
  window_stay_sec: [6, 18]        # сколько живёт на одном окне
  pause_chance: 0.15              # шанс остановиться на шаге (idle)
  min_window_width: 320
  min_window_height: 160
  ignore_titles: []               # заголовки, на которые садиться нельзя
  seed: null                      # сид генератора (для тестов)

paths:
  hermes_env: "C:/Users/igora/AppData/Local/hermes/.env"
